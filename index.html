<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlexNavi</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8f9fa;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Googleマップ風 上部検索バー */
    .search-wrapper {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
    }
    .search-container {
      background: #ffffff;
      border-radius: 28px;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.1);
    }
    .search-icon {
      color: #5f6368;
      font-size: 18px;
      margin-right: 12px;
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: #202124;
      background: transparent;
    }
    .search-input::placeholder {
      color: #70757a;
    }

    /* Google Autocomplete候補コンテナのスタイル調整 */
    .pac-container {
      z-index: 2000 !important;
      border-radius: 16px;
      margin-top: 8px;
      border: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2) !important;
      font-family: inherit;
    }
    .pac-item {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      line-height: 1.4;
    }
    .pac-item:first-child {
      border-top: none;
    }
    .pac-item-query {
      font-size: 14px;
      font-weight: bold;
      color: #202124;
    }

    /* 右下の現在地ボタン（GoogleマップFAB風） */
    .fab-recenter {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 1000;
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: transform 0.1s, background-color 0.2s;
    }
    .fab-recenter:active {
      transform: scale(0.92);
      background: #f1f3f4;
    }
    .fab-icon {
      width: 24px;
      height: 24px;
      fill: #1a73e8;
    }

    .speedometer {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 1000;
