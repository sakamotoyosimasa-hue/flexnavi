<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlexNavi</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 上部案内バー */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(20, 24, 33, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-instruction {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-primary {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .nav-secondary {
      font-size: 0.85rem;
      color: #9aa4b2;
    }
    .app-badge {
      background: #007aff;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* 左下：車速メーター */
    .speedometer-card {
      position: absolute;
      bottom: 100px;
      left: 16px;
      z-index: 1000;
      background: rgba(20, 24, 33, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px 18px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 90px;
    }
    .speed-value {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #30d158;
    }
    .speed-unit {
      font-size: 0.75rem;
      color: #8e8e93;
      margin-top: 4px;
      font-weight: 600;
    }

    /* 下部コントロールバー */
    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(20, 24, 33, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn {
      background: #2c3240;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.96);
      background: #3a4254;
    }
    .btn-primary {
      background: #007aff;
    }
    .btn-primary:active {
      background: #0062cc;
    }
  </style>
</head>
<body>

  <!-- 上部ナビゲーション表示 -->
  <div class="top-bar">
    <div class="nav-instruction">
      <div class="nav-primary" id="routeText">GPS測位中...</div>
      <div class="nav-secondary" id="subText">位置情報の取得待機中</div>
    </div>
    <div class="app-badge">FlexNavi</div>
  </div>

  <!-- 車速メーター -->
  <div class="speedometer-card">
    <div class="speed-value" id="speedDisplay">0</div>
    <div class="speed-unit">km/h</div>
  </div>

  <!-- 地図領域 -->
  <div id="map"></div>

  <!-- 下部操作パネル -->
  <div class="bottom-bar">
    <button class="btn" id="recenterBtn">現在地へ戻る</button>
    <button class="btn btn-primary" id="trackToggleBtn">追従: ON</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let isTracking = true;
    let userMarker = null;
    let accuracyCircle = null;

    // 地図の初期化（日本近郊）
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([34.6937, 135.5023], 15);

    // 地図タイルの設定（OpenStreetMap）
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // 現在地アイコン設定
    const userIcon = L.divIcon({
      className: 'custom-user-icon',
      html: '<div style="width:16px;height:16px;border-radius:50%;background:#007aff;border:3px solid #ffffff;box-shadow:0 0 8px rgba(0,122,255,0.8);"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    // 位置情報監視
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;
          const speedMs = pos.coords.speed; // m/s

          // 車速換算 (m/s -> km/h)
          const speedKmh = (speedMs && speedMs > 0) ? Math.round(speedMs * 3.6) : 0;
          document.getElementById('speedDisplay').textContent = speedKmh;

          // UI表示更新
          document.getElementById('routeText').textContent = "現在地を取得完了";
          document.getElementById('subText').textContent = `精度: ±${Math.round(accuracy)}m`;

          // マーカー描画/更新
          const latLng = [lat, lng];
          if (!userMarker) {
            userMarker = L.marker(latLng, { icon: userIcon }).addTo(map);
            accuracyCircle = L.circle(latLng, { radius: accuracy, color: '#007aff', fillOpacity: 0.1, weight: 1 }).addTo(map);
            map.setView(latLng, 16);
          } else {
            userMarker.setLatLng(latLng);
            accuracyCircle.setLatLng(latLng);
            accuracyCircle.setRadius(accuracy);
          }

          // 自動センタリング
          if (isTracking) {
            map.setView(latLng);
          }
        },
        (err) => {
          document.getElementById('routeText').textContent = "位置情報エラー";
          document.getElementById('subText').textContent = "位置情報の利用を許可してください";
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    } else {
      document.getElementById('routeText').textContent = "未対応ブラウザ";
      document.getElementById('subText').textContent = "Geolocation APIが使えません";
    }

    // ボタンイベント
    document.getElementById('recenterBtn').addEventListener('click', () => {
      if (userMarker) {
        map.setView(userMarker.getLatLng(), 16);
        isTracking = true;
        document.getElementById('trackToggleBtn').textContent = "追従: ON";
      }
    });

    document.getElementById('trackToggleBtn').addEventListener('click', () => {
      isTracking = !isTracking;
      document.getElementById('trackToggleBtn').textContent = isTracking ? "追従: ON" : "追従: OFF";
    });

    // 地図を手動ドラッグした場合は追従を自動OFF
    map.on('dragstart', () => {
      isTracking = false;
      document.getElementById('trackToggleBtn').textContent = "追従: OFF";
    });
  </script>
</body>
</html>
