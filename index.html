<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlexNavi</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #12161f;
      color: #ffffff;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 上部ナビ案内バー & 検索バー */
    .top-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-box {
      display: flex;
      gap: 6px;
      background: rgba(20, 24, 33, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      padding: 6px 8px;
    }
    .search-box input::placeholder {
      color: #7b8595;
    }
    .btn-search {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-card {
      background: rgba(20, 24, 33, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .nav-instruction {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-primary {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .nav-secondary {
      font-size: 0.8rem;
      color: #9aa4b2;
    }
    .route-meta {
      text-align: right;
    }
    .route-dist {
      font-size: 1.15rem;
      font-weight: 800;
      color: #30d158;
    }
    .route-time {
      font-size: 0.75rem;
      color: #8e8e93;
    }

    /* 左下：車速メーター */
    .speedometer-card {
      position: absolute;
      bottom: 92px;
      left: 12px;
      z-index: 1000;
      background: rgba(20, 24, 33, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 84px;
    }
    .speed-value {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #30d158;
    }
    .speed-unit {
      font-size: 0.7rem;
      color: #8e8e93;
      margin-top: 3px;
      font-weight: 600;
    }

    /* 下部操作パネル */
    .bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(20, 24, 33, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn {
      flex: 1;
      background: #2c3240;
      color: #ffffff;
      border: none;
      padding: 11px 0;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn:active {
      background: #3a4254;
      transform: scale(0.97);
    }
    .btn-primary {
      background: #007aff;
    }
    .btn-danger {
      background: #ff453a;
    }
  </style>
</head>
<body>

  <!-- 上部コンテナ -->
  <div class="top-container">
    <div class="search-box">
      <input type="text" id="destInput" placeholder="目的地を入力（例: 大阪駅, スーパー）">
      <button class="btn-search" id="searchBtn">検索</button>
    </div>
    <div class="nav-card">
      <div class="nav-instruction">
        <div class="nav-primary" id="routeText">地図をタップして目的地を選択</div>
        <div class="nav-secondary" id="subText">GPS測位中...</div>
      </div>
      <div class="route-meta" id="routeMeta" style="display:none;">
        <div class="route-dist" id="routeDist">-- km</div>
        <div class="route-time" id="routeTime">約 -- 分</div>
      </div>
    </div>
  </div>

  <!-- 車速メーター -->
  <div class="speedometer-card">
    <div class="speed-value" id="speedDisplay">0</div>
    <div class="speed-unit">km/h</div>
  </div>

  <!-- 地図領域 -->
  <div id="map"></div>

  <!-- 下部操作パネル -->
  <div class="bottom-bar">
    <button class="btn" id="recenterBtn">現在地へ</button>
    <button class="btn btn-primary" id="trackToggleBtn">追従: ON</button>
    <button class="btn btn-danger" id="clearRouteBtn" style="display:none;">案内終了</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let isTracking = true;
    let userMarker = null;
    let accuracyCircle = null;
    let destMarker = null;
    let routeLayer = null;

    let currentLat = null;
    let currentLng = null;
    let destLat = null;
    let destLng = null;

    // 地図初期化
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([34.6937, 135.5023], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // 自車アイコン
    const userIcon = L.divIcon({
      className: 'user-pin',
      html: '<div style="width:18px;height:18px;border-radius:50%;background:#007aff;border:3px solid #fff;box-shadow:0 0 10px rgba(0,122,255,0.9);"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    // 目的地ピンアイコン
    const destIcon = L.divIcon({
      className: 'dest-pin',
      html: '<div style="width:20px;height:20px;border-radius:50%;background:#ff3b30;border:3px solid #fff;box-shadow:0 0 10px rgba(255,59,48,0.9);"></div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    // GPS位置追跡
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;
          const speedMs = pos.coords.speed;

          // 速度更新 (km/h)
          const kmh = (speedMs && speedMs > 0) ? Math.round(speedMs * 3.6) : 0;
          document.getElementById('speedDisplay').textContent = kmh;
          document.getElementById('subText').textContent = `GPS精度: ±${Math.round(accuracy)}m`;

          const latLng = [currentLat, currentLng];
          if (!userMarker) {
            userMarker = L.marker(latLng, { icon: userIcon }).addTo(map);
            accuracyCircle = L.circle(latLng, { radius: accuracy, color: '#007aff', fillOpacity: 0.1, weight: 1 }).addTo(map);
            map.setView(latLng, 16);
          } else {
            userMarker.setLatLng(latLng);
            accuracyCircle.setLatLng(latLng);
            accuracyCircle.setRadius(accuracy);
          }

          if (isTracking) {
            map.setView(latLng);
          }

          // 目的地が設定されていれば定期的にルート更新
          if (destLat && destLng && isTracking) {
            fetchRoute(currentLat, currentLng, destLat, destLng, false);
          }
        },
        (err) => {
          document.getElementById('routeText').textContent = "位置情報取得不可";
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    // 地図タップで目的地指定
    map.on('click', (e) => {
      setDestination(e.latlng.lat, e.latlng.lng, "指定地点");
    });

    // 目的地設定 & ルート計算
    function setDestination(lat, lng, name) {
      destLat = lat;
      destLng = lng;

      if (destMarker) {
        destMarker.setLatLng([lat, lng]);
      } else {
        destMarker = L.marker([lat, lng], { icon: destIcon }).addTo(map);
      }

      document.getElementById('routeText').textContent = `${name} へのルート`;
      document.getElementById('clearRouteBtn').style.display = 'block';

      if (currentLat && currentLng) {
        fetchRoute(currentLat, currentLng, destLat, destLng, true);
      } else {
        alert("現在地が取得できるまでお待ちください");
      }
    }

    // OSRM ルート検索 API 呼び出し
    async function fetchRoute(startLat, startLng, endLat, endLng, fitBounds) {
      const url = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.routes || data.routes.length === 0) return;

        const route = data.routes[0];
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

        // 既存のルート描画を消去して再描画
        if (routeLayer) {
          map.removeLayer(routeLayer);
        }
        routeLayer = L.polyline(coords, {
          color: '#007aff',
          weight: 6,
          opacity: 0.85,
          lineJoin: 'round'
        }).addTo(map);

        // 距離と所要時間を表示
        const distKm = (route.distance / 1000).toFixed(1);
        const timeMin = Math.round(route.duration / 60);

        document.getElementById('routeMeta').style.display = 'block';
        document.getElementById('routeDist').textContent = `${distKm} km`;
        document.getElementById('routeTime').textContent = `約 ${timeMin} 分`;

        if (fitBounds) {
          map.fitBounds(routeLayer.getBounds(), { padding: [80, 80] });
          isTracking = false;
          document.getElementById('trackToggleBtn').textContent = "追従: OFF";
        }
      } catch (e) {
        console.error("ルート取得失敗:", e);
      }
    }

    // キーワード検索（Nominatim API）
    document.getElementById('searchBtn').addEventListener('click', async () => {
      const q = document.getElementById('destInput').value.trim();
      if (!q) return;

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=jp&limit=1`;
      try {
        const res = await fetch(url);
        const list = await res.json();
        if (list.length > 0) {
          const item = list[0];
          setDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',')[0]);
        } else {
          alert("目的地が見つかりませんでした");
        }
      } catch (e) {
        alert("検索エラーが発生しました");
      }
    });

    // 案内終了
    document.getElementById('clearRouteBtn').addEventListener('click', () => {
      if (routeLayer) map.removeLayer(routeLayer);
      if (destMarker) map.removeLayer(destMarker);
      destMarker = null;
      routeLayer = null;
      destLat = null;
      destLng = null;
      document.getElementById('routeMeta').style.display = 'none';
      document.getElementById('routeText').textContent = "地図をタップして目的地を選択";
      document.getElementById('clearRouteBtn').style.display = 'none';
    });

    // ボタンイベント
    document.getElementById('recenterBtn').addEventListener('click', () => {
      if (userMarker) {
        map.setView(userMarker.getLatLng(), 16);
        isTracking = true;
        document.getElementById('trackToggleBtn').textContent = "追従: ON";
      }
    });

    document.getElementById('trackToggleBtn').addEventListener('click', () => {
      isTracking = !isTracking;
      document.getElementById('trackToggleBtn').textContent = isTracking ? "追従: ON" : "追従: OFF";
    });

    map.on('dragstart', () => {
      isTracking = false;
      document.getElementById('trackToggleBtn').textContent = "追従: OFF";
    });
  </script>
</body>
</html>
