<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlexNavi</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8f9fa;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .search-wrapper {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 99999;
    }
    .search-container {
      background: #ffffff;
      border-radius: 28px;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }
    .search-icon {
      font-size: 18px;
      margin-right: 12px;
      color: #5f6368;
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: #202124;
      background: transparent;
    }
    .clear-btn {
      display: none;
      background: none;
      border: none;
      font-size: 18px;
      color: #70757a;
      padding: 6px;
      cursor: pointer;
    }
