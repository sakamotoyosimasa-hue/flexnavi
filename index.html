<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlexNavi</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8f9fa;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Googleマップ風 上部検索バー */
    .search-wrapper {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
    }
    .search-container {
      background: #ffffff;
      border-radius: 28px;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.1);
    }
    .search-icon {
      color: #5f6368;
      font-size: 18px;
      margin-right: 12px;
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      color: #202124;
      background: transparent;
    }
    .search-input::placeholder {
      color: #70757a;
    }

    /* Google Autocomplete候補コンテナのスタイル調整 */
    .pac-container {
      z-index: 2000 !important;
      border-radius: 16px;
      margin-top: 8px;
      border: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2) !important;
      font-family: inherit;
    }
    .pac-item {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      line-height: 1.4;
    }
    .pac-item:first-child {
      border-top: none;
    }
    .pac-item-query {
      font-size: 14px;
      font-weight: bold;
      color: #202124;
    }

    /* 右下の現在地ボタン（GoogleマップFAB風） */
    .fab-recenter {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 1000;
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: transform 0.1s, background-color 0.2s;
    }
    .fab-recenter:active {
      transform: scale(0.92);
      background: #f1f3f4;
    }
    .fab-icon {
      width: 24px;
      height: 24px;
      fill: #1a73e8;
    }

    /* 左下：車速メーター */
    .speedometer {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 8px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      text-align: center;
      min-width: 68px;
    }
    .speed-val {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1;
      color: #1a73e8;
      font-variant-numeric: tabular-nums;
    }
    .speed-lbl {
      font-size: 10px;
      font-weight: bold;
      color: #5f6368;
      margin-top: 2px;
    }

    /* 下部ルート案内カード */
    .route-card {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1001;
      background: #ffffff;
      border-radius: 20px 20px 0 0;
      padding: 16px 20px 24px 20px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
      transform: translateY(110%);
      transition: transform 0.28s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .route-card.show {
      transform: translateY(0);
    }
    .route-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .time-large {
      font-size: 1.8rem;
      font-weight: 700;
      color: #188038;
    }
    .dist-meta {
      font-size: 1rem;
      color: #5f6368;
      font-weight: 500;
    }
    .dest-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #202124;
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-actions {
      display: flex;
      gap: 12px;
    }
    .btn-start {
      flex: 1;
      background: #1a73e8;
      color: #ffffff;
      border: none;
      height: 44px;
      border-radius: 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-close {
      background: #f1f3f4;
      color: #3c4043;
      border: none;
      height: 44px;
      padding: 0 20px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Google風 上部フローティング検索バー -->
  <div class="search-wrapper">
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="destInput" placeholder="施設名・住所を検索（例: 買取一丁目 難波）" autocomplete="off" />
    </div>
  </div>

  <!-- 地図エリア -->
  <div id="map"></div>

  <!-- スピードメーター（左下） -->
  <div class="speedometer">
    <div class="speed-val" id="speedDisplay">0</div>
    <div class="speed-lbl">km/h</div>
  </div>

  <!-- Google風 現在地ボタン（右下FAB） -->
  <button class="fab-recenter" id="fabRecenter" title="現在地に戻る">
    <svg class="fab-icon" viewBox="0 0 24 24">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <!-- Google風 下部ルート案内カード -->
  <div class="route-card" id="routeCard">
    <div class="route-header">
      <div class="time-large" id="routeTime">約 -- 分</div>
      <div class="dist-meta" id="routeDist">(-- km)</div>
    </div>
    <div class="dest-title" id="destTitle">目的地</div>
    <div class="route-actions">
      <button class="btn-start" id="startBtn">ナビ開始</button>
      <button class="btn-close" id="closeBtn">閉じる</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Places API Script (日本語/日本優先) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDkb6oE-Z1m64bYzZAlJSkXC7m2MjD5PpY&libraries=places&language=ja&region=JP"></script>

  <script>
    let isTracking = true;
    let userMarker = null;
    let accuracyCircle = null;
    let destMarker = null;
    let routeLayer = null;

    let currentLat = null;
    let currentLng = null;
    let destLat = null;
    let destLng = null;

    // 地図初期化
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([34.73, 135.63], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // 自車アイコン
    const userIcon = L.divIcon({
      className: 'g-user-pin',
      html: '<div style="width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #ffffff;box-shadow:0 0 6px rgba(0,0,0,0.3);"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    // 目的地ピン
    const destIcon = L.divIcon({
      className: 'g-dest-pin',
      html: '<div style="width:20px;height:20px;border-radius:50%;background:#ea4335;border:3px solid #ffffff;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });

    // GPS位置追跡
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;
          const speedMs = pos.coords.speed;

          const kmh = (speedMs && speedMs > 0) ? Math.round(speedMs * 3.6) : 0;
          document.getElementById('speedDisplay').textContent = kmh;

          const latLng = [currentLat, currentLng];
          if (!userMarker) {
            userMarker = L.marker(latLng, { icon: userIcon }).addTo(map);
            accuracyCircle = L.circle(latLng, { radius: accuracy, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.12, weight: 1 }).addTo(map);
            map.setView(latLng, 16);
          } else {
            userMarker.setLatLng(latLng);
            accuracyCircle.setLatLng(latLng);
            accuracyCircle.setRadius(accuracy);
          }

          if (isTracking) {
            map.setView(latLng);
          }
        },
        (err) => console.warn(err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    // Google Places Autocomplete 初期化
    function initAutocomplete() {
      const input = document.getElementById('destInput');
      const autocomplete = new google.maps.places.Autocomplete(input, {
        componentRestrictions: { country: 'jp' },
        fields: ['name', 'formatted_address', 'geometry']
      });

      // 候補選択時のイベント
      autocomplete.addListener('place_changed', () => {
        const place = autocomplete.getPlace();
        if (!place.geometry || !place.geometry.location) {
          return;
        }

        const lat = place.geometry.location.lat();
        const lng = place.geometry.location.lng();
        const title = place.name || place.formatted_address;

        setDestination(lat, lng, title);
      });
    }

    // Googleスクリプト読込完了後に実行
    if (window.google && window.google.maps && window.google.maps.places) {
      initAutocomplete();
    } else {
      window.addEventListener('load', initAutocomplete);
    }

    // 地図タップで目的地指定
    map.on('click', (e) => {
      setDestination(e.latlng.lat, e.latlng.lng, "指定した地点");
    });

    function setDestination(lat, lng, title) {
      destLat = lat;
      destLng = lng;

      if (destMarker) {
        destMarker.setLatLng([lat, lng]);
      } else {
        destMarker = L.marker([lat, lng], { icon: destIcon }).addTo(map);
      }

      document.getElementById('destTitle').textContent = title;
      if (currentLat && currentLng) {
        fetchRoute(currentLat, currentLng, destLat, destLng);
      }
    }

    // OSRM ルート検索
    async function fetchRoute(startLat, startLng, endLat, endLng) {
      const url = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes || data.routes.length === 0) return;

        const route = data.routes[0];
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(coords, {
          color: '#1a73e8',
          weight: 6,
          opacity: 0.9,
          lineJoin: 'round'
        }).addTo(map);

        const distKm = (route.distance / 1000).toFixed(1);
        const timeMin = Math.round(route.duration / 60);

        document.getElementById('routeTime').textContent = `${timeMin} 分`;
        document.getElementById('routeDist').textContent = `(${distKm} km)`;

        document.getElementById('routeCard').classList.add('show');
        map.fitBounds(routeLayer.getBounds(), { padding: [80, 100] });
        isTracking = false;
      } catch (e) {
        console.error("ルート取得エラー:", e);
      }
    }

    // ナビ開始
    document.getElementById('startBtn').addEventListener('click', () => {
      if (userMarker) {
        map.setView(userMarker.getLatLng(), 17);
        isTracking = true;
      }
      document.getElementById('startBtn').textContent = "案内中";
      document.getElementById('startBtn').style.background = "#188038";
    });

    // 閉じる
    document.getElementById('closeBtn').addEventListener('click', () => {
      if (routeLayer) map.removeLayer(routeLayer);
      if (destMarker) map.removeLayer(destMarker);
      routeLayer = null;
      destMarker = null;
      destLat = null;
      destLng = null;
      document.getElementById('routeCard').classList.remove('show');
      document.getElementById('startBtn').textContent = "ナビ開始";
      document.getElementById('startBtn').style.background = "#1a73e8";
      document.getElementById('destInput').value = "";
    });

    // 現在地FAB
    document.getElementById('fabRecenter').addEventListener('click', () => {
      if (userMarker) {
        map.setView(userMarker.getLatLng(), 16);
        isTracking = true;
      }
    });

    map.on('dragstart', () => {
      isTracking = false;
    });
  </script>
</body>
</html>
